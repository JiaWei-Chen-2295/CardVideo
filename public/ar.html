<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <!-- Immersive on iOS, where the element Fullscreen API is unavailable. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>CardVideo · AR</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/ar.css" />

    <!--
      Import map.
        "three"        -> the compatibility shim, which re-exports the installed three.js
                          AND restores the legacy names mind-ar 1.2.5 still imports
                          (three.js dropped `sRGBEncoding` after r164, and mind-ar's
                          bundle cannot even parse without it).
        "mindar-image-three"
                       -> mind-ar's render bundle, loaded lazily by the viewer.
        "mindar-image-compile"
                       -> mind-ar's compiler bundle, loaded lazily by the compile worker
                          only, so the AR viewer never downloads @tensorflow/tfjs.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three.shim.js",
          "three/addons/": "/vendor/three-addons/",
          "mindar-image-three": "/vendor/mindar-image-three.prod.js",
          "mindar-image-compile": "/vendor/mindar-image-compile.js"
        }
      }
    </script>
  </head>

  <body>
    <!-- mind-ar injects the camera <video> and its canvases into this element. -->
    <div id="stage" class="ar-stage"></div>

    <div class="ar-chrome">
      <button id="exit" class="ar-exit" type="button" aria-label="退出 AR">
        <span aria-hidden="true">✕</span>
      </button>

      <button id="sound" class="ar-sound" type="button" hidden>
        <span aria-hidden="true">🔊</span>
        <span>开启声音</span>
      </button>

      <div id="hint" class="ar-hint ar-hint--soft" hidden role="status" aria-live="polite"></div>
    </div>

    <div id="overlay" class="ar-overlay">
      <div class="ar-overlay__inner">
        <h1 id="overlay-title">正在准备…</h1>
        <div id="overlay-body"><p>请稍候。</p></div>
        <div id="spinner-row" class="ar-spinner-row" hidden>
          <div class="spinner" aria-hidden="true"></div>
          <span id="progress-text"></span>
        </div>
        <button id="start" class="btn" type="button" hidden>开始体验</button>
      </div>
    </div>

    <script type="module" src="/js/viewer.js"></script>
  </body>
</html>
